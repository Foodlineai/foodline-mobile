name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      demo_mode:
        description: Build with demo fixtures instead of the live backend
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint

  apk:
    name: Build ${{ matrix.mode }} APK
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(github.event_name == 'push' && '["demo","live"]' || github.event_name == 'workflow_dispatch' && inputs.demo_mode == false && '["live"]' || '["demo"]') }}
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_DEMO_MODE: ${{ matrix.mode == 'demo' && '1' || '0' }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_WORKOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_WORKOS_CLIENT_ID }}
      EXPO_PUBLIC_WORKOS_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_WORKOS_AUTH_DOMAIN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Verify live configuration
        if: matrix.mode == 'live'
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          test -n "$EXPO_PUBLIC_WORKOS_CLIENT_ID"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name APK
        id: artifact
        run: |
          short_sha="${GITHUB_SHA::7}"
          file="Foodline-${{ matrix.mode }}-${short_sha}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foodline-${{ matrix.mode }}-${{ github.sha }}
          path: ${{ steps.artifact.outputs.file }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports-${{ matrix.mode }}-${{ github.sha }}
          path: |
            android/app/build/reports/**
            android/build/reports/**
          retention-days: 7
          if-no-files-found: ignore
